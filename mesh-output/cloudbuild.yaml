    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/prz-core-repo/health-svc']

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
